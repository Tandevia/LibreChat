name: Tandevia Workspace image

# Builds the rebranded LibreChat API image (client included), pushes it to
# ghcr.io/tandevia/librechat (private) and deploys it to the droplet behind
# ai.forscope.eu: the deploy key there is bound to /usr/local/bin/deploy-workspace,
# which pulls with the job's short-lived GITHUB_TOKEN. See deploy/ai.forscope.eu/README.md.
on:
  push:
    branches: [tandevia]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tandevia-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/tandevia/librechat
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:tandevia
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to ai.forscope.eu
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '104.248.43.141 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAtS01M2jZkpeloo1ERJsSYMvLs1VxstTfHUOFf5NrcO' > ~/.ssh/known_hosts
          # The key's forced command ignores whatever is passed here and runs
          # deploy-workspace, which reads the registry token from stdin.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@104.248.43.141 deploy
