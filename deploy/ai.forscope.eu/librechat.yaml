# Tandevia Workspace configuration for ai.forscope.eu.
# Schema: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17
cache: true

interface:
  customWelcome: 'Welcome to Tandevia Workspace.'
  privacyPolicy:
    externalUrl: 'https://tandevia.com/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://tandevia.com/terms'
    openNewTab: true

registration:
  # Sign-in is Google Workspace only; accounts outside these domains are refused.
  socialLogins: ['google']
  allowedDomains:
    - 'forscope.eu'
endpoints:
  custom:
    # Every model request goes through the Tandevia gateway of Forscope
    # (gateway.forscope.eu), as the application "LibreChat (ai.forscope.eu)".
    # The gateway holds the provider keys, applies the person's role, budget
    # and security policy, and logs the traffic.
    - name: 'Tandevia Gateway'
      apiKey: '${TANDEVIA_GATEWAY_KEY}'
      baseURL: 'https://gateway.forscope.eu/v1'
      # Who is asking: the signed-in person, by e-mail. The gateway trusts this
      # application to name them (allow_user_assertion) and then judges the
      # request on their role. LibreChat's own `user` (its internal id) is
      # dropped: the gateway reads that field first and would find nobody.
      headers:
        x-onesam-user: '{{LIBRECHAT_USER_EMAIL}}'
      dropParams: ['user']
      # Fixed list: what the application may use and every role at Forscope
      # allows, then what only Admins may use (others get "no access").
      # The first entry is the default: "auto" lets the gateway pick a model
      # the person may use, by how hard the question is.
      models:
        default:
          - 'auto'
          - 'gpt-5.6-sol'
          - 'gemini-3.5-flash'
          - 'gemini-2.5-flash'
          - 'gpt-5.4-nano'
          - 'claude-sonnet-5'
          - 'claude-opus-5'
          - 'gemini-3.1-flash-lite'
        fetch: false
      titleConvo: true
      titleModel: 'gpt-5.4-nano'
      modelDisplayLabel: 'Tandevia Gateway'
